<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Konnect Archify Tool</title>
  <desc id="desc">A source-backed architecture documentation pipeline for Konnect.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102947"/>
      <stop offset="1" stop-color="#123f52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8ab4ce" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="26" fill="url(#background)"/>
  <rect width="1280" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1120" cy="70" r="190" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="1160" cy="320" r="210" fill="#3b82f6" opacity="0.08"/>

  <g transform="translate(92 70)">
    <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="56" width="92" height="68" rx="14" fill="#0d2538"/>
      <rect x="178" y="0" width="92" height="68" rx="14" fill="#0d2538"/>
      <rect x="178" y="112" width="92" height="68" rx="14" fill="#0d2538"/>
      <path d="M92 90h43c18 0 25-18 43-40"/>
      <path d="M92 90h43c18 0 25 18 43 56"/>
      <circle cx="46" cy="90" r="10" fill="#5eead4" stroke="none" filter="url(#glow)"/>
      <circle cx="224" cy="34" r="9" fill="#60a5fa" stroke="none"/>
      <circle cx="224" cy="146" r="9" fill="#60a5fa" stroke="none"/>
    </g>
    <text x="46" y="96" text-anchor="middle" fill="#071426" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">K</text>
  </g>

  <g transform="translate(430 92)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="56" fill="#f8fafc" font-size="54" font-weight="750" letter-spacing="-1">Konnect Archify Tool</text>
    <rect x="0" y="82" width="680" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="125" fill="#b9d4e5" font-size="23">Architecture evidence, rendered clearly.</text>
    <text x="0" y="166" fill="#83a8bd" font-size="16" letter-spacing="1.2">SOURCE-BACKED  •  VALIDATED  •  REPEATABLE  •  STANDALONE</text>
  </g>

  <g transform="translate(430 292)" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">
    <rect x="0" y="0" width="126" height="32" rx="16" fill="#17394a" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="63" y="21" text-anchor="middle" fill="#bff7ef">5 diagram modes</text>
    <rect x="140" y="0" width="128" height="32" rx="16" fill="#17394a" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="204" y="21" text-anchor="middle" fill="#c5dcff">offline HTML</text>
    <rect x="282" y="0" width="142" height="32" rx="16" fill="#17394a" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="353" y="21" text-anchor="middle" fill="#bff7ef">one-command refresh</text>
  </g>
</svg>
