name: Publish architecture diagrams

on:
  push:
    branches: [main]
    paths:
      - "diagrams/output/**"
      - "docs/assets/konnect-archify-tool-banner.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage Pages site
        shell: bash
        run: |
          mkdir -p _site/assets
          cp -R diagrams/output/. _site/
          cp docs/assets/konnect-archify-tool-banner.svg _site/assets/

      - name: Upload delivered diagrams
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
